name: keep backend awake

# Supabase pauses a free project after about a week with no traffic, and a paused backend makes the app's
# feedback box fail with "Couldn't save" (found paused 2026-11-25). One tiny read every 3 days keeps it awake.
# Uses the same public URL + anon key the build already gets from repo secrets.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # public.ping() just returns 1 (supabase/keepalive_ping.sql) — the app's lessons are bundled, so
          # there's no content table to read here.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' -d '{}')
          echo "status $code"
          test "$code" = 200
